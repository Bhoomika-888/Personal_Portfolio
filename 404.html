<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Bhoomika</title>
  <meta name="description" content="The requested page could not be found." />
  <meta name="theme-color" content="#0a192f" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .not-found-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--shadow-lg), var(--shadow-cyan);
    }
    .not-found-code {
      font-family: var(--font-mono);
      font-size: clamp(4rem, 10vw, 6.5rem);
      font-weight: 800;
      color: var(--cyan-primary);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    .not-found-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .not-found-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .not-found-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="not-found-section">
    <div class="not-found-card">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">
        The page or resource you are looking for doesn't exist or has been relocated.
      </p>
      <div class="not-found-actions">
        <a href="/" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Return to Portfolio
        </a>
        <a href="/assets/Bhoomika_Resume.pdf" class="btn btn-outline" target="_blank" rel="noopener noreferrer">
          View Resume
        </a>
      </div>
    </div>
  </div>

  <script>
    // Theme initialization from localStorage
    const savedTheme = localStorage.getItem('bhoomika_portfolio_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
